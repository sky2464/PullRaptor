[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pullraptor"
version = "0.1.0b1"
description = "Deterministic offline pull request reviewer with verified coverage"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "Apache-2.0"}
authors = [
    {name = "PullRaptor Authors"}
]
keywords = ["code-review", "pull-request", "static-analysis", "security"]
dependencies = []

[project.scripts]
pullraptor = "pullraptor.__main__:main"
pullraptor-publish = "pullraptor.publisher:main"
pullraptor-mcp = "pullraptor.mcp_server:console_main"

[tool.setuptools.packages.find]
where = ["src"]
