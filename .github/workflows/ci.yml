name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify CI policy from trusted base
        if: github.event_name == 'pull_request'
        run: |
          PYTHONPATH=src python3.12 -m pullraptor.publication_trust verify-dev-ci \
            --base "${{ github.event.pull_request.base.sha }}" \
            --required-marker "unittest discover" \
            --required-marker "Verify PR branch naming"

      - name: Verify PR branch naming convention
        if: github.event_name == 'pull_request'
        run: |
          BRANCH="${{ github.head_ref }}"
          if [[ ! "$BRANCH" =~ ^(feat|fix|chore|docs)/[a-zA-Z0-9._-]+$ ]]; then
            echo "ERROR: Branch '$BRANCH' violates project naming convention (must be feat/*, fix/*, chore/*, docs/*)." >&2
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run test suite
        run: |
          PYTHONPATH=src:. python3 -m unittest discover -s tests -v

      - name: Install package and verify beta CLI containment
        run: |
          pip install -e .
          bash scripts/ci_beta_install_smoke.sh

      - name: Record linux-x86_64 offline wheel install smoke
        run: |
          export PULLRAPTOR_WORKFLOW_DIGEST="${{ hashFiles('.github/workflows/ci.yml') }}"
          export PULLRAPTOR_RUN_ID="${{ github.run_id }}-ci-linux-install"
          export PULLRAPTOR_REPOSITORY_ID="${{ github.repository }}"
          PYTHONPATH=src python3.12 release/build.py --output-dir build/ci-release-candidate
          python3.12 -m venv /tmp/pr-beta-venv
          /tmp/pr-beta-venv/bin/pip install --no-index build/ci-release-candidate/*.whl
          PATH="/tmp/pr-beta-venv/bin:$PATH" bash scripts/ci_beta_install_smoke.sh
          mkdir -p docs/acceptance/artifacts/E07/install
          python3.12 - <<'PY'
          import json, subprocess, hashlib, glob
          from pathlib import Path
          wheel = Path(glob.glob("build/ci-release-candidate/*.whl")[0])
          digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
          rev = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          receipt = {
              "schema": "pullraptor-install-receipt/1",
              "profile_id": "python-3.12-linux-x86_64-venv",
              "platform": "linux-x86_64",
              "runtime": "python-3.12",
              "operation": "offline_wheel_venv_install",
              "result": "development_verified",
              "source_revision": rev,
              "artifact_digest_sha256": digest,
              "workflow": "ci.yml",
              "note": "CI job smoke; independent BR-10 acceptance remains pending.",
          }
          out = Path("docs/acceptance/artifacts/E07/install/linux-x86_64-ci-smoke.json")
          out.write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload linux install smoke receipt
        uses: actions/upload-artifact@v4
        with:
          name: e07-linux-install-smoke
          path: docs/acceptance/artifacts/E07/install/linux-x86_64-ci-smoke.json

      - name: Verify PullRaptor self-review
        run: |
          pullraptor --base HEAD~1 --head HEAD --exact-base

  docker:
    name: Docker Build & Container Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Docker container
        run: |
          docker build -t pullraptor:ci .

      - name: Run test suite inside Docker
        run: |
          docker run --rm pullraptor:ci

      - name: Run review on mounted workspace inside Docker
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" pullraptor:ci python -m pullraptor --repo /repo --base HEAD~1 --head HEAD --exact-base
