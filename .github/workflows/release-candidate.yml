# Release-candidate provenance workflow (uploads remain separately authorized).
name: Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364e1ed6ad # v4.2.2
        with:
          persist-credentials: false
      - name: Build release candidate (not product acceptance)
        env:
          PULLRAPTOR_WORKFLOW_DIGEST: ${{ hashFiles('.github/workflows/release-candidate.yml') }}
          PULLRAPTOR_RUN_ID: ${{ github.run_id }}
          PULLRAPTOR_REPOSITORY_ID: ${{ github.repository }}
        run: |
          PYTHONPATH=src python3.12 release/build.py --output-dir build/release-candidate
